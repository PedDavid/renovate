name: GHCR auth retry test image

on:
  push:
    branches:
      - fork/ghcr-auth-retry

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'PedDavid/renovate'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
        with:
          node-version: 24
          os: ${{ runner.os }}
          use-cache: 'false'
      - run: pnpm build
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Login to fork GHCR only
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and publish test image
        env:
          SHA: ${{ github.sha }}
        run: |
          tag="ghcr.io/peddavid/renovate:ghcr-auth-retry-${SHA:0:12}"
          docker buildx build --platform linux/amd64 --file tools/docker/Dockerfile \
            --build-arg RENOVATE_VERSION="ghcr-auth-retry-${SHA:0:12}" \
            --tag "$tag" --push .
          docker buildx imagetools inspect "$tag"
